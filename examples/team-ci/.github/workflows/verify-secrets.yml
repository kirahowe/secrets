name: Verify encrypted secrets manifest

on:
  push:
    paths:
      - "examples/team-ci/**"
  pull_request:
    paths:
      - "examples/team-ci/**"

jobs:
  # Keyless freshness gate: this job needs Babashka, but neither age nor an
  # identity. It checks the committed SHA-256 in the value-free manifest.
  manifest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/team-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.13.219
      - run: bb secrets verify fixture
