name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A Pages deployment from main must run to completion; feature-ref builds
  # can still be superseded by a newer push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  bb-test:
    name: Babashka tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.13.219

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Show Babashka version
        run: bb --version

      - name: Run Babashka tests
        run: bb test

      - name: Smoke-test quickstart example
        working-directory: examples/quickstart-bb
        shell: bash
        run: |
          set -euo pipefail
          trap 'bb cleanup >/dev/null 2>&1 || true' EXIT
          bb bootstrap
          bb run
          bb verify

      - name: Test Aero profiles example
        working-directory: examples/aero-profiles
        run: bb test

      - name: Verify team CI fixture without a key
        working-directory: examples/team-ci
        run: bb verify

  jvm-test:
    name: JVM tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'tests.edn', 'build.clj', 'examples/integrant-service/deps.edn', 'examples/integrant-service/build.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Show JVM and Clojure versions
        run: |
          java --version
          clojure -Sdescribe

      - name: Run JVM tests
        run: clojure -M:test

      - name: Bootstrap Integrant service example
        working-directory: examples/integrant-service
        run: ./scripts/bootstrap-demo.sh

      - name: Run Integrant service JVM tests
        working-directory: examples/integrant-service
        run: clojure -M:test

      - name: Build Integrant service uberjar
        working-directory: examples/integrant-service
        run: clojure -T:build uber

  build-and-inspect-jar:
    name: Build and inspect JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'build.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Show JVM and Clojure versions
        run: |
          java --version
          clojure -Sdescribe

      - name: Build library JAR
        run: clojure -T:build jar

      - name: Inspect built JAR and embedded POM
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "${jar_file}"
          bash .github/scripts/inspect-jar.sh "${jar_file}"

      - name: Upload JAR inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: |
            target/*.jar
            target/jar-entries.txt
            target/expected-src-entries.txt
            target/actual-src-entries.txt
            target/jar-pom.xml
            target/jar-pom.properties
          if-no-files-found: error

  build-book:
    name: Build Quarto book
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI and Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
          bb: 1.13.219

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'bb.edn', 'clay.edn', 'book/chapters/**/*.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Show tool versions
        run: |
          java --version
          clojure -Sdescribe
          bb --version
          quarto --version
          age --version

      - name: Build Quarto book with Clay
        run: bb book:build

      - name: Verify rendered book output
        shell: bash
        run: |
          set -euo pipefail
          test -f book/rendered/index.html
          test -f book/rendered/_quarto.yml
          touch book/rendered/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/rendered

  deploy-pages:
    name: Deploy book to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - bb-test
      - jvm-test
      - build-and-inspect-jar
      - build-book
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
