name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A Pages deployment from main must run to completion; feature-ref builds
  # can still be superseded by a newer push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  bb-java-free-runtime:
    name: Babashka Java-free runtime smoke
    runs-on: ubuntu-latest
    container:
      # babashka/babashka:1.13.219
      image: babashka/babashka@sha256:bac7033becd44e73225c2684312066034d6ad9b9a2d5d1100f89a71863074830

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install --yes age git

      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prove the isolated direct-classpath quickstart runtime works without Java
        run: bash .github/scripts/smoke-bb-java-free-runtime-quickstart.sh

  bb-test:
    name: Babashka tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          bb: 1.13.219

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Show Babashka version
        run: bb --version

      - name: Run Babashka tests
        run: bb test

      - name: Smoke-test project initialization
        run: bash .github/scripts/smoke-project-initialization.sh

      - name: Smoke-test quickstart example
        working-directory: examples/quickstart-bb
        shell: bash
        run: |
          set -euo pipefail
          trap 'bb cleanup >/dev/null 2>&1 || true' EXIT
          bb bootstrap
          bb run
          bb verify

      - name: Test Aero profiles example
        working-directory: examples/aero-profiles
        run: bb test

      - name: Verify team CI fixture without a key
        working-directory: examples/team-ci
        run: bb verify

  jvm-test:
    name: JVM tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'tests.edn', 'build.clj', 'examples/integrant-service/deps.edn', 'examples/integrant-service/build.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Show JVM and Clojure versions
        run: |
          java --version
          clojure -Sdescribe

      - name: Run JVM tests
        run: clojure -M:test

      - name: Bootstrap Integrant service example
        working-directory: examples/integrant-service
        run: ./scripts/bootstrap-demo.sh

      - name: Run Integrant service JVM tests
        working-directory: examples/integrant-service
        run: clojure -M:test

      - name: Build Integrant service uberjar
        working-directory: examples/integrant-service
        run: clojure -T:build uber

  dependency-advisory-audit:
    name: Audit every dependency graph
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664

      # The :audit runner downloads OSV-Scanner 2.5.1 and verifies its release
      # checksum from .github/dependency-audit.edn before executing it. It then
      # resolves the default graph and every alias independently. There is no
      # advisory allowlist: one package match makes this step fail.
      - name: Resolve and scan every exact dependency graph
        run: clojure -M:audit

      - name: Upload exact coordinates, dependency paths, and scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-advisory-audit
          path: |
            target/dependency-audit/*/coordinates.edn
            target/dependency-audit/*/tree.edn
            target/dependency-audit/*/osv-scanner.json
            target/dependency-audit/*/osv-result.json
          if-no-files-found: error

  build-and-inspect-jar:
    name: Build and inspect JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'build.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Show JVM and Clojure versions
        run: |
          java --version
          clojure -Sdescribe

      - name: Build library JAR
        run: clojure -T:build jar

      - name: Inspect built JAR and embedded POM
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "${jar_file}"
          bash .github/scripts/inspect-jar.sh "${jar_file}"

      - name: Upload JAR inspection artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jar-artifacts
          path: |
            target/*.jar
            target/jar-entries.txt
            target/expected-src-entries.txt
            target/actual-src-entries.txt
            target/jar-pom.xml
            target/jar-pom.properties
          if-no-files-found: error

  build-book:
    name: Build Quarto book
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI and Babashka
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
          bb: 1.13.219

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.18

      - name: Cache Clojure dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', 'bb.edn', 'clay.edn', 'book/chapters/**/*.clj') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Show tool versions
        run: |
          java --version
          clojure -Sdescribe
          bb --version
          quarto --version
          age --version

      - name: Build Quarto book with Clay
        run: bb book:build

      - name: Verify rendered book output
        shell: bash
        run: |
          set -euo pipefail
          test -f book/rendered/index.html
          test -f book/rendered/_quarto.yml
          touch book/rendered/.nojekyll

      # `bb book:build` already ran this over its own output, so a failure here
      # is either a non-reproducible render or a rewrite that did not hold. It
      # runs as its own step so the reason names itself in the job log instead of
      # arriving at the end of the render.
      - name: Verify the Pages artifact carries no third-party assets
        run: bb book:policy

      - name: Prove no external script or stylesheet URL survives
        shell: bash
        run: |
          set -euo pipefail
          ! grep -rEn '<script[^>]*src[[:space:]]*=[[:space:]]*"?([a-zA-Z][a-zA-Z0-9+.-]*:)?//|<link[^>]*href[[:space:]]*=[[:space:]]*"?([a-zA-Z][a-zA-Z0-9+.-]*:)?//|@import[[:space:]]*(url\()?[[:space:]]*["'"'"']?([a-zA-Z][a-zA-Z0-9+.-]*:)?//' book/rendered
          test "$(grep -rl 'http-equiv="Content-Security-Policy"' --include='*.html' book/rendered | wc -l)" -eq "$(find book/rendered -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book/rendered

  deploy-pages:
    name: Deploy book to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - bb-java-free-runtime
      - bb-test
      - jvm-test
      - dependency-advisory-audit
      - build-and-inspect-jar
      - build-book
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
